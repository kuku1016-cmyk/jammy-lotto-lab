<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAMMY LOTTO LAB</title><style>body{font-family:system-ui;background:#101b30;color:#fff;margin:0}main{max-width:700px;margin:auto;padding:20px}.card{background:#1b2b44;border-radius:18px;padding:18px;margin:16px 0}button{font-size:16px;border:1px solid #64738a;border-radius:12px;padding:12px;background:#314761;color:white;margin:3px}button.active,#draw{background:#28bfa6;color:#082d2b;font-weight:bold}.balls{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 18px}.ball{width:39px;height:39px;border-radius:50%;background:#4387bd;display:grid;place-items:center;font-weight:bold}.ball:nth-child(3n){background:#bd6377}.ball:nth-child(4n){background:#4b9b79}.item{padding:8px 0;border-bottom:1px solid #42516b}small,p{color:#b5c4d6} .machine{margin:18px auto;padding:20px 12px;border:4px solid #47c9ad;border-radius:50%;width:min(100%,320px);aspect-ratio:1;background:radial-gradient(circle,#253f60,#101b30);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;box-shadow:0 0 24px #16a08555}.machine-title{font-weight:800;margin-bottom:15px}.machine-balls{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:230px}.machine-balls .ball{width:48px;height:48px;font-size:19px}.machine-balls .ball:nth-child(3n){background:#d7a040}.machine-balls .ball:nth-child(4n){background:#ba6275} #modes{display:flex;flex-wrap:wrap;gap:5px} #modes button{flex:1 1 42%;min-width:125px} </style></head><body><main><small>🍀 JAMMY FAMILY</small><h1>JAMMY LOTTO LAB</h1><p>가족 고정픽 5게임 + 실험 5게임</p><section class="card"><h2>실험 번호 생성</h2><div id="modes"><button data-mode="random" class="active">완전 무작위</button><button data-mode="spread">번호 분산</button><button data-mode="consecutive">연속번호</button><button data-mode="ending">동끝수</button><button data-mode="mix">연속·동끝수</button></div><p id="hint">어떤 조합도 당첨 확률은 같습니다.</p><button id="draw">🍀 실험 5게임 추첨</button><div class="machine"><div class="machine-title">🎱 JAMMY 원형 추첨기</div><div id="machine" class="machine-balls">추첨 버튼을 눌러 주세요</div></div><div id="generated"></div><button id="copy">10게임 복사</button><button id="save">기록 저장</button><p id="status"></p></section><section class="card"><h2>가족 고정 5게임</h2><div id="fixed"></div></section><section class="card"><h2>저장 기록</h2><div id="history"></div><button id="clear">기록 삭제</button></section><p>번호 패턴은 재미와 조합 다양성을 위한 것으로 미래 당첨을 예측하지 않습니다.</p></main><script>
const family=[['A 시은이',[4,12,17,18,23,36]],['B 지안이',[2,8,14,17,29,41]],['C 아내',[6,13,22,31,38,45]],['D 아빠',[10,16,19,27,34,43]],['E 가족 4명',[4,10,16,17,18,42]]];let mode='random',games=[];const el=id=>document.getElementById(id),numbers=Array.from({length:45},(_,i)=>i+1);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function choose(a){return a[Math.floor(Math.random()*a.length)]}function gen(){for(let i=0;i<500;i++){let s=[];if(mode==='consecutive'||mode==='mix'){let n=choose(numbers.slice(0,44));s=[n,n+1]}if(mode==='ending'||mode==='mix'){let a=choose(numbers.filter(n=>!s.includes(n))),opts=numbers.filter(n=>n!==a&&n%10===a%10&&!s.includes(n));if(!opts.length)continue;s.push(a,choose(opts))}if(mode==='spread'){s=[[1,9],[10,18],[19,27],[28,36],[37,45]].map(([a,b])=>a+Math.floor(Math.random()*(b-a+1)))}let x=[...s,...shuffle(numbers.filter(n=>!s.includes(n))).slice(0,6-s.length)].sort((a,b)=>a-b);if(new Set(x).size===6)return x}return shuffle(numbers).slice(0,6).sort((a,b)=>a-b)}function balls(a){return '<div class="balls">'+a.map(n=>'<span class="ball">'+n+'</span>').join('')+'</div>'}function render(){el('fixed').innerHTML=family.map(([n,a])=>'<div class="item"><b>'+n+'</b>'+balls(a)+'</div>').join('');el('generated').innerHTML=games.map((a,i)=>'<div class="item"><b>실험 '+(i+1)+'</b>'+balls(a)+'</div>').join('')}el('modes').onclick=e=>{let b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));el('hint').textContent={random:'모든 번호 조합의 당첨 확률은 같습니다.',spread:'여러 번호대에 걸쳐 분산합니다.',consecutive:'연속된 번호 한 쌍을 포함합니다.',ending:'끝자리가 같은 번호 한 쌍을 포함합니다.',mix:'연속번호와 동끝수 한 쌍씩 포함합니다.'}[mode]};el('draw').onclick=()=>{games=[];for(let i=0;i<5;i++)games.push(gen());render();el('machine').innerHTML=balls(games[0]);el('status').textContent='5게임 생성 완료'};el('copy').onclick=async()=>{if(!games.length)el('draw').click();let t=[...family.map(([n,a])=>n+': '+a.join(' ')),...games.map((a,i)=>'실험 '+(i+1)+': '+a.join(' '))].join('\n');try{await navigator.clipboard.writeText(t);el('status').textContent='복사 완료'}catch(e){el('status').textContent='복사 권한이 없어요'}};const key='jammy-lotto-history';function hist(){let h=[];try{h=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}el('history').innerHTML=h.length?h.map(x=>'<div class="item">'+x.date+' ('+x.mode+')<br>'+x.games.map(a=>a.join(' · ')).join('<br>')+'</div>').join(''):'아직 기록이 없어요'}el('save').onclick=()=>{if(!games.length)el('draw').click();try{let h=JSON.parse(localStorage.getItem(key)||'[]');h.unshift({date:new Date().toLocaleString('ko-KR'),mode,games});localStorage.setItem(key,JSON.stringify(h.slice(0,50)));hist();el('status').textContent='저장 완료'}catch(e){el('status').textContent='브라우저 저장이 제한돼 있어요'}}};el('clear').onclick=()=>{if(confirm('저장 기록을 삭제할까요?')){localStorage.removeItem(key);hist()}};render();hist();
</script></body></html>
